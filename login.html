<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login | OneUp</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body class="auth-page">
  <main class="auth-container">
    <section class="auth-form" id="loginBox">
      <h1>Entrar na OneUp</h1>
      <p>Acesse seu perfil gamer, favoritos e avaliações salvas.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">E-mail</label>
          <input id="loginEmail" type="email" placeholder="seuemail@email.com" required />
        </div>

        <div class="form-group">
          <label for="loginPassword">Senha</label>
          <input id="loginPassword" type="password" placeholder="Sua senha" required />
        </div>

        <div class="auth-message" id="loginMessage"></div>

        <button class="btn-primary" type="submit">Entrar</button>
      </form>

      <div class="auth-switch">
        Não tem conta?
        <button type="button" id="showRegisterButton">Criar conta</button>
      </div>

      <div class="auth-switch">
        <a href="index.html">← Voltar para Home</a>
      </div>
    </section>

    <section class="auth-form hidden" id="registerBox">
      <h1>Criar conta</h1>
      <p>Crie um perfil gamer para salvar favoritos e avaliações.</p>

      <form id="registerForm">
        <div class="form-group">
          <label for="registerName">Nome de usuário</label>
          <input id="registerName" type="text" placeholder="Ex: MarcosGamer" required />
        </div>

        <div class="form-group">
          <label for="registerEmail">E-mail</label>
          <input id="registerEmail" type="email" placeholder="seuemail@email.com" required />
        </div>

        <div class="form-group">
          <label for="registerPassword">Senha</label>
          <input id="registerPassword" type="password" placeholder="Mínimo 4 caracteres" required />
        </div>

        <div class="auth-message" id="registerMessage"></div>

        <button class="btn-primary" type="submit">Registrar</button>
      </form>

      <div class="auth-switch">
        Já tem conta?
        <button type="button" id="showLoginButton">Fazer login</button>
      </div>
    </section>

    <section class="auth-visual">
      <img id="authImage" src="assets/images/personagem.png" alt="Personagem Gamer" />
    </section>
  </main>

  <script src="assets/js/auth.js"></script>
  <script>
    const loginBox = document.getElementById('loginBox');
    const registerBox = document.getElementById('registerBox');
    const authImage = document.getElementById('authImage');

    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');

    const loginMessage = document.getElementById('loginMessage');
    const registerMessage = document.getElementById('registerMessage');

    document.getElementById('showRegisterButton').addEventListener('click', () => {
      loginBox.classList.add('hidden');
      registerBox.classList.remove('hidden');
      authImage.src = 'assets/images/personagem2.png';
    });

    document.getElementById('showLoginButton').addEventListener('click', () => {
      registerBox.classList.add('hidden');
      loginBox.classList.remove('hidden');
      authImage.src = 'assets/images/personagem.png';
    });

    registerForm.addEventListener('submit', (event) => {
      event.preventDefault();

      const name = document.getElementById('registerName').value.trim();
      const email = document.getElementById('registerEmail').value.trim().toLowerCase();
      const password = document.getElementById('registerPassword').value.trim();

      if (password.length < 4) {
        registerMessage.textContent = 'A senha precisa ter pelo menos 4 caracteres.';
        registerMessage.className = 'auth-message error';
        return;
      }

      const result = registerUser(name, email, password);

      registerMessage.textContent = result.message;
      registerMessage.className = result.success
        ? 'auth-message success'
        : 'auth-message error';

      if (result.success) {
        registerForm.reset();

        setTimeout(() => {
          registerBox.classList.add('hidden');
          loginBox.classList.remove('hidden');
          authImage.src = 'assets/images/personagem.png';
          loginMessage.textContent = 'Conta criada. Faça login para continuar.';
          loginMessage.className = 'auth-message success';
        }, 800);
      }
    });

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();

      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value.trim();

      const result = loginUser(email, password);

      loginMessage.textContent = result.message;
      loginMessage.className = result.success
        ? 'auth-message success'
        : 'auth-message error';

      if (result.success) {
  setTimeout(() => {
    if (result.user.role === 'admin') {
      window.location.href = 'admin.html';
    } else {
      window.location.href = 'perfil.html';
    }
  }, 500);
}
    });
  </script>
</body>
</html>
